[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "setuptools_scm>=9"]

[project]
name = "instagram-offline"
dynamic = ["version"]
description = "Download the photos, videos and reels of Instagram accounts into a browsable local site"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10, <3.15"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Multimedia :: Video",
  "Topic :: System :: Archiving",
]
dependencies = [
    "playwright>=1.50",
    "requests>=2.32",
]

[project.optional-dependencies]
mypy = [
  "mypy>=1.19",
  "types-requests>=2.32",
]
unittest = [
  "coverage[toml]>=7",
  "pytest>=8",
]

[project.scripts]
insta = "insta.cli:main"
instagram-offline = "insta.cli:main"

[project.urls]
Source = "https://github.com/bittner/instagram-offline"
Changelog = "https://github.com/bittner/instagram-offline/releases"
Issues = "https://github.com/bittner/instagram-offline/issues"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
fail_under = 100
show_missing = true

[tool.coverage.run]
source = ["insta"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--ignore=tests/browser"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # missing-trailing-comma: formatter-owned
  "CPY001",  # SPDX headers are used instead of full copyright headers
  "D203", "D213",  # docstring style: pick D211/D212 instead (mutually exclusive)
  "ANN",     # type annotations are not enforced project-wide
  "T201",    # the CLI reports progress on the console
  "S603", "S607",  # launching Chromium from PATH is how the tool works
  "BLE001",  # broad excepts keep the download loop going on single-post failures
  "S311",    # no cryptographic use of randomness
  "PLR2004", # magic values in media_type comparisons read fine
  "E731",    # a lambda as an event handler is fine
  "PERF203", # per-post try/except in the download loop is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # asserts are the whole point of a test
  "D",       # docstrings enforced on insta/, not on tests
  "INP001",  # test packages need no __init__.py
  "ARG",     # pytest fixtures are injected as (often unused) arguments
  "PLR2004", # literal expectations are fine in tests
  "EM", "TRY003",  # inline exception messages are fine in test doubles
  "FBT",     # boolean flags on test doubles are fine
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
packages = ["insta"]

[tool.setuptools_scm]
