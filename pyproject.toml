[project]
name = "instagram-downloader"
version = "0.1.0"
description = "Download videos and reels from Instagram accounts into a browsable local site"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50",
    "requests>=2.32",
]

[project.scripts]
insta = "insta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insta"]
