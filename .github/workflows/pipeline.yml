name: Pipeline

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
        - format --diff
        - lint --diff
        - precommit
        - reuse
        - types
        - packaging
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: false
    - uses: taiki-e/install-action@just
    - run: just ${{ matrix.task }}

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - uses: taiki-e/install-action@just
    - run: just pytest
    - run: just coverage

  browser:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: false
    - uses: taiki-e/install-action@just
    - run: uv run playwright install --with-deps chromium
    - run: just browser
